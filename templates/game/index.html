<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="A tiny arcade game built with OpenBuilder."><title>Star Catcher — OpenBuilder</title><link rel="stylesheet" href="style.css"></head>
<body><main><div class="top"><span class="eyebrow">OPENBUILDER • PLAYABLE GAME</span><span id="score" aria-live="polite">Score: 0</span></div><h1>Star Catcher</h1><p>Catch the falling stars. Use arrow keys, A/D, or drag on your phone.</p><div class="stage"><canvas id="game" width="640" height="420" aria-label="Star Catcher game" role="img"></canvas></div><div class="controls"><button type="button" id="start">Start / Restart</button><span id="status" aria-live="polite">Press Start to play</span></div><p class="hint">A self-contained browser game. No accounts, API keys, or database needed.</p></main><script type="module" src="game.js"></script></body></html>
